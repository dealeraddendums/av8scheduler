# /etc/nginx/sites-available/n4368v
# N4368V Aircraft Scheduler — static SPA served from /var/www/n4368v

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name n4368v.com www.n4368v.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n4368v.com www.n4368v.com;

    root /var/www/n4368v;
    index index.html;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/n4368v.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n4368v.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json;
}
