name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @av8/web build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan is occasionally flaky from Actions runners — retry
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 10 -H ${{ secrets.EC2_IP }} >> ~/.ssh/known_hosts && break
            echo "ssh-keyscan attempt $i failed; retrying in 5s…"
            sleep 5
          done
          # fail the step clearly if we never got a host key
          grep -q . ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            apps/web/dist/ \
            ubuntu@${{ secrets.EC2_IP }}:/var/www/n4368v/
